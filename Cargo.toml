[package]
name = "covid19_spatiotemp_simulator"
version = "0.1.0"
edition = "2021"
authors = ["Jose Arturo Barrera <j.arturo.b.g@gmail.com>"]
description = "A COVID dynamics simulator based on cellular automata"
readme = "README.md"
keywords = ["cli", "ca", "simulator"]
categories = ["command-line-utilities"]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
rand = "0.7.3"
serde = { version = "1.0", features = ["derive"] }
toml = "0.5"
csv = "1.1"
chrono = "0.4.19"
clap = { version = "4.0", features = ["derive"]}

[profile.release]
opt-level = 3
